name: Bug report
description: Report a reproducible setup, controls, or display problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please read the known issues first. Do not attach private saves, full game files, or personal data."
  - type: input
    id: version
    attributes:
      label: Preview version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Controls or throwing
        - Flashing or display
        - Installation or verification
        - Backup or undo
        - Other gameplay
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and actual behavior
      description: "Give exact inputs and steps. For throwing, name the object and both combat bindings."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Installation and environment
      description: "Did Setup report success? Did you fully restart the game? Include game build, Windows version, installed plugins, renderer checkbox state, resolution, and FPS."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: "Relevant error text, screenshots, or short logs with personal information removed."
